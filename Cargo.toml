[package]
name = "nostr-dag"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DAG-based optimistic consensus for Nostr"

[dependencies]
nostr = { version = "0.44", default-features = false, features = ["std"] }
nostr-relay-pool = "0.44.3"
rand = "0.8"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
nostr-relay-builder = "0.44.0"

[[bin]]
name = "federation"
path = "src/bin/federation.rs"

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "relay"
path = "src/bin/relay.rs"
required-features = ["relay"]

[features]
default = []
relay = ["dep:nostr-relay-builder"]

[dependencies.nostr-relay-builder]
version = "0.44.0"
optional = true
