<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Federated Chat Demo</title>
  <script src="https://unpkg.com/nostr-tools@2.10.4/lib/nostr.bundle.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { color: #8b5cf6; margin-bottom: 5px; }
    .subtitle { color: #888; margin-bottom: 20px; }
    .config {
      background: #16213e;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .config label { display: block; margin-bottom: 10px; }
    .config input {
      width: 100%;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0f0f23;
      color: #eee;
      margin-top: 5px;
    }
    .config button {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    .config button:hover { background: #7c3aed; }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .status.connected { background: #065f46; }
    .status.disconnected { background: #7f1d1d; }
    #messages {
      background: #16213e;
      border-radius: 8px;
      padding: 15px;
      min-height: 300px;
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 20px;
    }
    .message {
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      transition: all 0.3s ease;
    }
    .message.pending {
      background: #1e293b;
      opacity: 0.6;
      border-left: 3px solid #f59e0b;
    }
    .message.canonical {
      background: #1e3a5f;
      opacity: 1;
      border-left: 3px solid #10b981;
    }
    .message .author {
      font-size: 0.75rem;
      color: #8b5cf6;
      margin-bottom: 5px;
    }
    .message .content { font-size: 0.95rem; }
    .message .meta {
      font-size: 0.7rem;
      color: #666;
      margin-top: 5px;
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #0f0f23;
      color: #eee;
    }
    .input-area button {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      cursor: pointer;
    }
    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 0.8rem;
    }
    .legend span { display: flex; align-items: center; gap: 5px; }
    .legend .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .legend .dot.pending { background: #f59e0b; }
    .legend .dot.canonical { background: #10b981; }
  </style>
</head>
<body>
  <h1>Federated Chat</h1>
  <p class="subtitle">DAG-based consensus demo</p>

  <div class="config" id="configPanel">
    <label>
      Relay URL
      <input type="text" id="relayUrl" value="ws://localhost:8080">
    </label>
    <label>
      Federation Pubkeys (5 members)
      <input type="text" id="federationPubkeys" value="f7514e8321b886099a4e51c80055b20f500c3fa2f413ec6d2cf124dffbcfb116,a8d28940780397138a55ead4cd262748cacdbec8e0635e347c08fa3733d6168b,667cb2016acf35ab4f9cc9c57868d00490498d7a91eb0ad72a64afe30326e8ba,b871279ede482b7a657965512fef25e6ebb11c8f6397aa8af38a6761a176ec6b,e3876c803509eb00fb83ac513050632980e8ec1e9f469148a0485adbf896483f" disabled style="background: #1a1a2e; color: #666;">
    </label>
    <label>
      Your Private Key (hex or nsec, leave blank to generate)
      <input type="text" id="privateKey" placeholder="optional">
    </label>
    <button onclick="connect()">Connect</button>
  </div>

  <div class="status disconnected" id="status">Disconnected</div>

  <div class="legend">
    <span><span class="dot pending"></span> Pending (not canonical)</span>
    <span><span class="dot canonical"></span> Canonical (majority acked)</span>
  </div>

  <div id="messages"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const DAG_EVENT_KIND = 21000;
    const CHANNEL_MESSAGE_KIND = 42;
    const FEDERATION_PUBKEYS = [
      'f7514e8321b886099a4e51c80055b20f500c3fa2f413ec6d2cf124dffbcfb116',
      'a8d28940780397138a55ead4cd262748cacdbec8e0635e347c08fa3733d6168b',
      '667cb2016acf35ab4f9cc9c57868d00490498d7a91eb0ad72a64afe30326e8ba',
      'b871279ede482b7a657965512fef25e6ebb11c8f6397aa8af38a6761a176ec6b',
      'e3876c803509eb00fb83ac513050632980e8ec1e9f469148a0485adbf896483f',
    ];

    let ws = null;
    let keys = null;
    let federationPubkeys = new Set(FEDERATION_PUBKEYS);
    let threshold = Math.floor(FEDERATION_PUBKEYS.length / 2);

    const dag = {
      events: new Map(),
      seenBy: new Map(),
      children: new Map(),
    };

    function parentsOf(event) {
      return (event.tags || [])
        .filter(t => t[0] === 'e')
        .map(t => t[1]);
    }

    function insertEvent(event) {
      const id = event.id;
      if (dag.events.has(id)) return false;

      dag.events.set(id, event);
      dag.seenBy.set(id, new Set());

      const parents = parentsOf(event);
      for (const parentId of parents) {
        if (!dag.children.has(parentId)) {
          dag.children.set(parentId, new Set());
        }
        dag.children.get(parentId).add(id);
      }

      const isFedMember = federationPubkeys.has(event.pubkey);
      if (event.kind === DAG_EVENT_KIND && !isFedMember) {
        console.log('Federation lookup failed!');
        console.log('  Event pubkey:', JSON.stringify(event.pubkey));
        console.log('  Federation pubkeys:', [...federationPubkeys].map(p => JSON.stringify(p)));
      }
      console.log('insertEvent:', {
        id: id.slice(0, 8),
        kind: event.kind,
        pubkey: event.pubkey.slice(0, 8),
        parents: parents.map(p => p.slice(0, 8)),
        isFedMember,
        federationSize: federationPubkeys.size
      });

      if (isFedMember) {
        markSeenByAncestors(id, event.pubkey);
      }

      return true;
    }

    function markSeenByAncestors(id, pubkey) {
      const stack = [id];
      while (stack.length > 0) {
        const current = stack.pop();
        const seenBy = dag.seenBy.get(current);
        if (seenBy && !seenBy.has(pubkey)) {
          seenBy.add(pubkey);
          const event = dag.events.get(current);
          if (event) {
            stack.push(...parentsOf(event));
          }
        }
      }
    }

    function isCanonical(id) {
      const seenBy = dag.seenBy.get(id);
      return seenBy && seenBy.size > threshold;
    }

    function connect() {
      const relayUrl = document.getElementById('relayUrl').value;
      const privKeyStr = document.getElementById('privateKey').value.trim();

      if (privKeyStr) {
        if (privKeyStr.startsWith('nsec')) {
          keys = NostrTools.nip19.decode(privKeyStr).data;
        } else {
          keys = privKeyStr;
        }
      } else {
        keys = NostrTools.generateSecretKey();
      }

      const pubkey = NostrTools.getPublicKey(keys);
      console.log('Your pubkey:', pubkey);

      ws = new WebSocket(relayUrl);

      ws.onopen = () => {
        document.getElementById('status').textContent = `Connected as ${pubkey.slice(0, 8)}...`;
        document.getElementById('status').className = 'status connected';
        document.getElementById('configPanel').style.display = 'none';

        const subId = 'sub1';
        const filter = { kinds: [CHANNEL_MESSAGE_KIND, DAG_EVENT_KIND], limit: 500 };
        ws.send(JSON.stringify(['REQ', subId, filter]));
      };

      ws.onclose = () => {
        document.getElementById('status').textContent = 'Disconnected';
        document.getElementById('status').className = 'status disconnected';
      };

      ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data[0] === 'EVENT') {
          const event = data[2];
          if (insertEvent(event)) {
            renderMessages();
          } else {
            if (dag.events.has(event.id)) {
              renderMessages();
            }
          }
        }
      };
    }

    function renderMessages() {
      const container = document.getElementById('messages');
      const chatMessages = [...dag.events.values()]
        .filter(e => e.kind === CHANNEL_MESSAGE_KIND)
        .sort((a, b) => a.created_at - b.created_at);

      chatMessages.forEach(event => {
        const seenBy = dag.seenBy.get(event.id) || new Set();
        console.log('Message', event.id.slice(0, 8), 'seenBy:', [...seenBy].map(p => p.slice(0, 8)), 'threshold:', threshold);
      });

      container.innerHTML = chatMessages.map(event => {
        const canonical = isCanonical(event.id);
        const seenBy = dag.seenBy.get(event.id) || new Set();
        return `
          <div class="message ${canonical ? 'canonical' : 'pending'}">
            <div class="author">${event.pubkey.slice(0, 12)}...</div>
            <div class="content">${escapeHtml(event.content)}</div>
            <div class="meta">
              ${canonical ? '✓ Canonical' : '⏳ Pending'}
              (${seenBy.size}/${federationPubkeys.size} acks)
            </div>
          </div>
        `;
      }).join('');

      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;

      const event = {
        kind: CHANNEL_MESSAGE_KIND,
        created_at: Math.floor(Date.now() / 1000),
        tags: [],
        content: content,
        pubkey: NostrTools.getPublicKey(keys),
      };

      event.id = NostrTools.getEventHash(event);
      event.sig = NostrTools.finalizeEvent(event, keys).sig;

      ws.send(JSON.stringify(['EVENT', event]));
      input.value = '';

      insertEvent(event);
      renderMessages();
    }
  </script>
</body>
</html>
