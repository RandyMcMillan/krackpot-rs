<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nostr-dag Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 20px; background:#0f172a; color:#e2e8f0; }
    h1 { margin: 0 0 6px; color: #a78bfa; }
    .muted { color:#94a3b8; }
    .panel { background:#111827; border:1px solid #334155; border-radius:8px; padding:14px; margin:14px 0; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input, select, button { background:#020617; color:#e2e8f0; border:1px solid #334155; border-radius:6px; padding:8px; }
    button { cursor:pointer; background:#4c1d95; border-color:#6d28d9; }
    button:hover { background:#5b21b6; }
    .status { padding:8px 10px; border-radius:6px; margin-top:10px; }
    .ok { background:#065f46; }
    .err { background:#7f1d1d; }
    .grid { display:grid; grid-template-columns: 1fr 2fr; gap:14px; }
    .chip { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; }
    .canonical { background:#065f46; }
    .pending { background:#78350f; }
    .njump-link { background:transparent; padding:0; color:#22c55e; text-decoration:none; }
    .njump-link:hover { text-decoration:underline; }
    .event { border:1px solid #334155; border-radius:8px; padding:10px; margin-bottom:8px; background:#0b1220; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size:12px; }
    .small { font-size:12px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>nostr-dag:
    <a href="https://github.com/RandyMcMillan/nostr-dag/actions/workflows/ci.yml">
      <img src="https://github.com/RandyMcMillan/nostr-dag/actions/workflows/ci.yml/badge.svg" alt="CI" />
    </a>
    </h1>
  <div class="muted">This page runs the Rust DAG logic in WASM and lets you create Nostr events locally.</div>
  <div class="small muted" style="margin-top:6px;">Browser publisher sends federation ack events to public relays too.</div>

  <div class="panel">
    <div class="row">
      <button id="resetBtn">Reset DAG</button>
      <button id="seedBtn">Create Genesis (all participants)</button>
      <button id="ackRoundBtn">Run Ack Round</button>
      <span id="status" class="status">Loading WASM...</span>
    </div>
    <div class="small muted" style="margin-top:8px;">Tip: open this via HTTP (GitHub Pages or local server), not <span class="mono">file://</span>.</div>
  </div>

  <div class="grid">
    <form class="panel" id="createForm">
      <h3>New Event</h3>
      <div class="row" style="margin-bottom:8px;">
        <label>Author</label>
        <select id="author"></select>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <label>Kind</label>
        <select id="kind">
          <option value="21000" selected>21000 (ack)</option>
          <option value="0">0 (metadata)</option>
          <option value="1">1 (text note)</option>
          <option value="42">42 (message)</option>
        </select>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <label>Content</label>
        <input id="content" placeholder="optional content" style="flex:1;" />
      </div>
      <div class="row" style="margin-bottom:8px;">
        <label>Parents</label>
        <select id="parentsMode">
          <option value="tips">Current tips</option>
          <option value="none">No parents (genesis)</option>
          <option value="custom">Custom IDs</option>
        </select>
      </div>
      <div class="row">
        <input id="customParents" class="mono" style="flex:1;" placeholder="comma-separated event IDs" />
      </div>
      <div class="row" style="margin-top:10px;">
        <button id="createBtn" type="submit">Create Event</button>
      </div>
    </form>

    <div class="panel">
      <h3>State</h3>
      <ul id="stateList" class="small muted" style="margin:8px 0; padding-left:18px;"></ul>
      <div id="events"></div>
    </div>
  </div>

  <script type="module">
    import init, { WasmDag } from './pkg/nostr_dag.js';
    import { finalizeEvent, generateSecretKey, getPublicKey } from 'https://esm.sh/nostr-tools@2.10.4/pure';
    import { neventEncode } from 'https://esm.sh/nostr-tools@2.10.4/nip19';
    import { SimplePool } from 'https://esm.sh/nostr-tools@2.10.4/pool';

    const RELAYS = [
      'wss://relay.damus.io',
      'wss://nos.lol',
      'wss://relay.nostr.band',
      'wss://relay.primal.net',
      'wss://nostr.wine',
    ];
    const SITE_URL = 'https://randymcmillan.github.io/nostr-dag';
    const QUORUM_ID = 'nostr-dag-quorum-5';
    const PARTICIPANT_NAMES = ['alice', 'bob', 'carol', 'dave', 'eve'];
    const PARTICIPANT_DISPLAY_NAMES = ['Alice', 'Bob', 'Carol', 'Dave', 'Eve'];

    const FED_COUNT = 5;
    let dag = null;
    let participants = [];
    const discoveredParticipants = new Map();
    const events = new Map();
    const njumpAvailability = new Map();
    const pool = new SimplePool();
    const broadcastRelays = new Set(RELAYS);
    const watchedRelays = new Set();
    const retryTimers = new Map();
    let njumpPollTimer = null;
    let relayDiscoveryStarted = false;

    const statusEl = document.getElementById('status');
    const authorEl = document.getElementById('author');
    const kindEl = document.getElementById('kind');
    const contentEl = document.getElementById('content');
    const parentsModeEl = document.getElementById('parentsMode');
    const customParentsEl = document.getElementById('customParents');
    const createFormEl = document.getElementById('createForm');
    const stateListEl = document.getElementById('stateList');

    const short = (id) => id ? `${id.slice(0, 10)}…` : '-';

    function njumpUrlForEvent(eventId) {
      return `https://njump.me/${neventEncode({ id: eventId })}`;
    }

    function njumpProbeUrlForEvent(eventId) {
      return `https://njump.me/image/${neventEncode({ id: eventId })}?v=${Date.now()}`;
    }

    function scheduleNjumpPolling() {
      if (njumpPollTimer) return;
      njumpPollTimer = window.setInterval(() => {
        for (const event of events.values()) {
          if (!njumpAvailability.get(event.id)?.available) {
            probeNjump(event.id);
          }
        }
      }, 15000);
    }

    function probeNjump(eventId) {
      if (njumpAvailability.get(eventId)?.available) return;

      const img = new Image();
      img.referrerPolicy = 'no-referrer';
      img.onload = () => {
        njumpAvailability.set(eventId, { available: true, url: njumpUrlForEvent(eventId) });
        render();
      };
      img.onerror = () => {
        if (!njumpAvailability.has(eventId)) {
          njumpAvailability.set(eventId, { available: false, url: njumpUrlForEvent(eventId) });
          render();
        }
      };
      img.src = njumpProbeUrlForEvent(eventId);
      scheduleNjumpPolling();
    }

    function setStatus(message, ok = true) {
      statusEl.textContent = message;
      statusEl.className = `status ${ok ? 'ok' : 'err'}`;
    }

    function scheduleRetry(key, fn, delayMs) {
      if (retryTimers.has(key)) return;
      const timer = window.setTimeout(() => {
        retryTimers.delete(key);
        fn();
      }, delayMs);
      retryTimers.set(key, timer);
    }

    function registerParticipant(participant) {
      if (!participant?.pk) return;
      const existing = discoveredParticipants.get(participant.pk) || {};
      discoveredParticipants.set(participant.pk, {
        ...existing,
        ...participant,
        pk: participant.pk,
      });
    }

    function participantLabel(pubkey) {
      return discoveredParticipants.get(pubkey)?.name
        || participants.find((p) => p.pk === pubkey)?.name
        || pubkey.slice(0, 8);
    }

    function normalizeRelayUrl(url) {
      try {
        const parsed = new URL(url);
        if (parsed.protocol !== 'ws:' && parsed.protocol !== 'wss:') return null;
        return parsed.toString().replace(/\/$/, '');
      } catch {
        return null;
      }
    }

    function addBroadcastRelay(url) {
      const normalized = normalizeRelayUrl(url);
      if (!normalized || broadcastRelays.has(normalized)) return false;
      broadcastRelays.add(normalized);
      watchRelayMetadata(normalized);
      render();
      return true;
    }

    function collectRelayUrls(value, found = new Set()) {
      if (typeof value === 'string') {
        const normalized = normalizeRelayUrl(value);
        if (normalized) found.add(normalized);
        return found;
      }

      if (Array.isArray(value)) {
        for (const item of value) collectRelayUrls(item, found);
        return found;
      }

      if (value && typeof value === 'object') {
        for (const item of Object.values(value)) collectRelayUrls(item, found);
      }

      return found;
    }

    function discoverFromEvent(event) {
      if (event.kind === 10002) {
        for (const tag of event.tags) {
          if (tag[0] === 'r' && tag[1]) addBroadcastRelay(tag[1]);
        }
        return;
      }

      if (event.kind === 0) {
        try {
          const metadata = JSON.parse(event.content || '{}');
          registerParticipant({
            pk: event.pubkey,
            name: metadata.name,
            displayName: metadata.display_name || metadata.displayName,
            about: metadata.about,
            picture: metadata.picture,
            website: metadata.website,
          });
          for (const relay of collectRelayUrls(metadata)) {
            addBroadcastRelay(relay);
          }
          render();
        } catch {
          // Ignore malformed metadata.
        }
        return;
      }

      if (event.kind === 3) {
        try {
          const legacy = JSON.parse(event.content || '{}');
          for (const relay of collectRelayUrls(legacy)) addBroadcastRelay(relay);
        } catch {
          // Ignore malformed legacy relay lists.
        }
      }
    }

    function startRelayDiscovery() {
      if (relayDiscoveryStarted) return;
      relayDiscoveryStarted = true;

      for (const relay of RELAYS) {
        watchRelayMetadata(relay);
      }
    }

    function watchRelayMetadata(relayUrl) {
      const normalized = normalizeRelayUrl(relayUrl);
      if (!normalized || watchedRelays.has(normalized)) return;
      watchedRelays.add(normalized);

      pool.subscribeMany(
        [normalized],
        { kinds: [0, 10002, 3], limit: 200 },
        {
          onevent(event) {
            discoverFromEvent(event);
          },
          oneose() {},
        }
      );
    }

    function initParticipants() {
      participants = Array.from({ length: FED_COUNT }, (_, i) => {
        const sk = generateSecretKey();
        const pk = getPublicKey(sk);
        const name = PARTICIPANT_NAMES[i] || `participant${i + 1}`;
        const displayName = PARTICIPANT_DISPLAY_NAMES[i] || `Participant ${i + 1}`;
        return {
          name,
          displayName,
          about: `Member ${i + 1} of the nostr-dag quorum (quorum_id: ${QUORUM_ID}).`,
          picture: `https://api.dicebear.com/9.x/identicon/svg?seed=${encodeURIComponent(name)}`,
          website: SITE_URL,
          quorumId: QUORUM_ID,
          sk,
          pk,
        };
      });
      discoveredParticipants.clear();

      authorEl.innerHTML = participants
        .map((p, i) => `<option value="${i}">${p.name} (${p.pk.slice(0, 12)}…)</option>`)
        .join('');
    }

    async function resetDag() {
      initParticipants();
      dag = new WasmDag(JSON.stringify(participants.map((p) => p.pk)));
      events.clear();
      njumpAvailability.clear();
      render();
      setStatus('WASM loaded. DAG reset with 5 participants.', true);
      await publishProfiles();
    }

    function buildMetadataEvent(author) {
      const profile = {
        name: author.name,
        display_name: author.displayName,
        about: author.about,
        picture: author.picture,
        website: author.website,
        quorum_id: author.quorumId,
      };

      return finalizeEvent({
        kind: 0,
        created_at: Math.floor(Date.now() / 1000),
        tags: [],
        content: JSON.stringify(profile),
        pubkey: author.pk,
      }, author.sk);
    }

    function buildQuorumGroupEvent(author, profileEventIds, participantPubkeys) {
      const tags = [
        ...profileEventIds.map((id) => ['e', id]),
        ...participantPubkeys.map((pk) => ['p', pk]),
        ['d', QUORUM_ID],
        ['t', 'nostr-dag'],
        ['t', 'quorum'],
      ];

      return finalizeEvent({
        kind: 1,
        created_at: Math.floor(Date.now() / 1000),
        tags,
        content: `Quorum member note for ${participants.length} participants.`,
        pubkey: author.pk,
      }, author.sk);
    }

    function currentTips() {
      return JSON.parse(dag.tip_ids());
    }

    function canonicalSet() {
      return new Set(JSON.parse(dag.canonical_ids()));
    }

    function resolveParents() {
      const mode = parentsModeEl.value;
      if (mode === 'none') return [];
      if (mode === 'custom') {
        return customParentsEl.value
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean);
      }
      return currentTips();
    }

    function buildEvent(author, kind, content, parentIds) {
      const tags = parentIds.map((id) => ['e', id]);
      const event = {
        kind,
        created_at: Math.floor(Date.now() / 1000),
        tags,
        content,
        pubkey: author.pk,
      };
      return finalizeEvent(event, author.sk);
    }

    function insertEvent(event) {
      const result = JSON.parse(dag.insert(JSON.stringify(event)));
      if (result.type === 'Duplicate') {
        throw new Error('Duplicate event');
      }
      probeNjump(event.id);
      events.set(event.id, {
        id: event.id,
        kind: event.kind,
        author: event.pubkey,
        content: event.content,
        created_at: event.created_at,
        parents: event.tags.filter((t) => t[0] === 'e').map((t) => t[1]),
        status: result.type,
      });
    }

    async function publishEvent(event) {
      try {
        await Promise.any(pool.publish([...broadcastRelays], event));
        setStatus(`Published ${event.kind} to ${broadcastRelays.size} public relays.`, true);
      } catch (e) {
        setStatus(`Local only: publish failed (${e.message})`, false);
      }
    }

    async function publishEvents(eventsToPublish, successLabel) {
      const results = await Promise.allSettled(
        eventsToPublish.map((event) => Promise.any(pool.publish([...broadcastRelays], event)))
      );
      const published = results.filter((result) => result.status === 'fulfilled').length;

      if (published > 0) {
        setStatus(`${successLabel} published to public relays (${published}/${eventsToPublish.length}).`, true);
      } else {
        setStatus(`Local only: publish failed for ${successLabel}`, false);
        scheduleRetry(
          `${successLabel}:${eventsToPublish.map((event) => event.id).join(',')}`,
          () => void publishEvents(eventsToPublish, successLabel),
          5000
        );
      }
    }

    function createAckRoundEvents() {
      const tips = currentTips();
      const acks = [];
      for (const author of participants) {
        const event = buildEvent(author, 21000, '', tips);
        insertEvent(event);
        acks.push(event);
      }
      return acks;
    }

    async function createEvent() {
      try {
        const author = participants[Number(authorEl.value)];
        const kind = Number(kindEl.value);
        const content = contentEl.value.trim();
        const parents = resolveParents();
        const event = kind === 0 && !content
          ? buildMetadataEvent(author)
          : buildEvent(author, kind, content, parents);
        insertEvent(event);
        contentEl.value = '';
        render();
        await publishEvent(event);
      } catch (e) {
        setStatus(`Create failed: ${e.message}`, false);
      }
    }

    async function seedGenesis() {
      try {
        const seeded = [];
        for (const author of participants) {
          const event = buildEvent(author, 21000, 'genesis', []);
          insertEvent(event);
          seeded.push(event);
        }
        render();
        await publishEvents(seeded, 'Genesis quorum');
      } catch (e) {
        setStatus(`Seed failed: ${e.message}`, false);
      }
    }

    async function runAckRound() {
      try {
        const acks = createAckRoundEvents();
        render();
        await publishEvents(acks, 'Ack round');
      } catch (e) {
        setStatus(`Ack round failed: ${e.message}`, false);
      }
    }

    async function autoAckUntilCanonical(targetId, maxRounds = 5) {
      for (let round = 1; round <= maxRounds; round++) {
        if (dag.is_canonical(targetId)) return;

        const acks = createAckRoundEvents();
        render();
        await publishEvents(acks, `Auto ack round ${round}`);

        if (dag.is_canonical(targetId)) return;
        await new Promise((resolve) => window.setTimeout(resolve, 500));
      }
    }

    async function publishProfiles() {
      const profileEvents = participants.map((author) => buildMetadataEvent(author));
      for (const event of profileEvents) {
        insertEvent(event);
      }
      render();
      await publishEvents(profileEvents, 'Quorum metadata');

      const profileEventIds = profileEvents.map((event) => event.id);
      const participantPubkeys = participants.map((participant) => participant.pk);
      const quorumEvent = buildQuorumGroupEvent(participants[participants.length - 1], profileEventIds, participantPubkeys);
      insertEvent(quorumEvent);
      render();
      await publishEvents([quorumEvent], 'Quorum note');
      await autoAckUntilCanonical(quorumEvent.id);
    }

    function render() {
      const canonical = canonicalSet();
      const tips = currentTips();
      const list = [...events.values()].sort((a, b) => a.created_at - b.created_at || a.id.localeCompare(b.id));

      const threshold = Math.floor(participants.length / 2);
      const relayList = [...broadcastRelays].sort();
      const quorumMembers = [...participants].sort((a, b) => a.name.localeCompare(b.name));
      const detectedParticipants = [...discoveredParticipants.values()].sort((a, b) =>
        (a.name || a.pk).localeCompare(b.name || b.pk)
      );
      const tipsMarkup = tips.length
        ? tips.map((tip) => {
            const tipEvent = events.get(tip);
            const signer = tipEvent ? participantLabel(tipEvent.author) : 'unknown';
            const njump = njumpAvailability.get(tip);
            const njumpLink = njump?.available
              ? ` <a class="njump-link" href="${njump.url}" target="_blank" rel="noreferrer noopener" title="Open in njump">●</a>`
              : '';
            return `<li style="word-break:break-all;"><span class="mono">${tip}</span> <span class="small muted">(${signer})</span>${njumpLink}</li>`;
          }).join('')
        : '<li>none</li>';

      stateListEl.innerHTML = `
        <li>${list.length} events</li>
        <li>${canonical.size} canonical</li>
        <li>threshold &gt; ${threshold} of ${participants.length}</li>
        <li>quorum members (${quorumMembers.length}):
          <ul style="margin:6px 0 0 16px;">
            ${quorumMembers.map((p) => `<li style="word-break:break-all;"><span class="mono">${p.pk}</span> <span class="small muted">(${p.name})</span></li>`).join('')}
          </ul>
        </li>
        <li>network-detected participants (${detectedParticipants.length}):
          <ul style="margin:6px 0 0 16px;">
            ${detectedParticipants.map((p) => `<li style="word-break:break-all;"><span class="mono">${p.pk}</span> <span class="small muted">(${p.name || p.displayName || 'unknown'})</span></li>`).join('')}
          </ul>
        </li>
        <li>broadcast relays (${broadcastRelays.size}):
          <ul style="margin:6px 0 0 16px;">
            ${relayList.map((relay) => `<li style="word-break:break-all;"><span class="mono">${relay}</span></li>`).join('')}
          </ul>
        </li>
        <li>Tips:<ul style="margin:6px 0 0 16px;">${tipsMarkup}</ul></li>
      `;

      document.getElementById('events').innerHTML = list.map((e) => {
        const who = participantLabel(e.author);
        const stateClass = canonical.has(e.id) ? 'canonical' : 'pending';
        const stateText = canonical.has(e.id) ? 'canonical' : 'pending';
        const njump = njumpAvailability.get(e.id);
        const njumpMarkup = njump?.available
          ? `<a class="njump-link" href="${njump.url}" target="_blank" rel="noreferrer noopener" title="Open in njump">●</a>`
          : '';
        return `
          <div class="event">
            <div class="row" style="justify-content:space-between;">
              <div><b>${who}</b> <span class="small muted">kind ${e.kind}</span></div>
              <div class="row">
                ${njumpMarkup}
                <span class="chip ${stateClass}">${stateText}</span>
              </div>
            </div>
            <div class="mono">id: ${e.id}</div>
            <div class="small" style="word-break:break-all;">parents: ${e.parents.length ? e.parents.join(', ') : 'none'}</div>
            <div class="small">content: ${e.content ? e.content.replace(/[<>&]/g, '') : '""'}</div>
          </div>
        `;
      }).join('');

      setStatus('DAG updated.', true);
    }

    createFormEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      await createEvent();
    });
    document.getElementById('seedBtn').addEventListener('click', () => { void seedGenesis(); });
    document.getElementById('ackRoundBtn').addEventListener('click', () => { void runAckRound(); });
    document.getElementById('resetBtn').addEventListener('click', () => { void resetDag(); });

    try {
      await init();
      startRelayDiscovery();
      await resetDag();
    } catch (e) {
      setStatus(`WASM load failed: ${e.message}`, false);
    }
  </script>
</body>
</html>
