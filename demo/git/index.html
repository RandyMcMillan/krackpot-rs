<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nostr-dag Git Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --fg: #0f172a;
      --muted: #475569;
      --panel: #ffffff;
      --card: #f8fafc;
      --border: #cbd5e1;
      --status: #e2e8f0;
      --button: #7c3aed;
      --button-hover: #6d28d9;
      --button-fg: #ffffff;
      --footer: #f1f5f9;
      --heading: #6d28d9;
      --link: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --panel: #111827;
        --card: #0b1220;
        --border: #334155;
        --status: #1f2937;
        --button: #4c1d95;
        --button-hover: #5b21b6;
        --button-fg: #e2e8f0;
        --footer: #020617;
        --heading: #a78bfa;
        --link: #93c5fd;
      }
    }
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px 20px 80px; background:var(--bg); color:var(--fg); }
    h1 { margin: 0 0 6px; color: var(--heading); }
    .muted { color: var(--muted); }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; margin:14px 0; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    .repo { border:1px solid var(--border); border-radius:8px; background:var(--card); padding:12px; }
    .repo.active { border-color: var(--heading); box-shadow: 0 0 0 1px rgba(124, 58, 237, 0.18); }
    .repo h3 { margin-top:0; }
    .repo-title { display:flex; align-items:center; gap:8px; margin:0; }
    .repo-title a { color: inherit; text-decoration: none; }
    .repo-icon { width:16px; height:16px; border-radius:3px; flex:0 0 auto; }
    .repo-footer { display:flex; justify-content:flex-end; margin-top:12px; padding-top:10px; border-top:1px solid var(--border); }
    .repo-actions { display:flex; gap:8px; align-items:center; }
    .repo-open { display:inline-flex; }
    .repo-refresh { display:inline-flex; }
    .status { padding:8px 10px; border-radius:6px; background:var(--status); border:1px solid var(--border); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size:12px; }
    ul { padding-left:18px; }
    a { color: var(--link); }
    button, a.button { background:var(--button); color:var(--button-fg); border:1px solid var(--border); border-radius:6px; padding:8px 12px; text-decoration:none; cursor:pointer; }
    button:hover, a.button:hover { background:var(--button-hover); }
    .sticky-footer { position:fixed; left:0; right:0; bottom:0; background:var(--footer); border-top:1px solid var(--border); padding:10px 20px; z-index:40; }
    .sticky-footer-inner { max-width:1200px; margin:0 auto; }
    @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <h1>nostr-dag Git Viewer</h1>
  <div class="muted">Browse cloned repositories in the browser. Endpoint: <span class="mono">/git/</span></div>

  <div class="panel">
    <div class="row">
      <button id="refreshBtn" type="button">Refresh repos</button>
      <a class="button" href="../"><span>Back to demo</span></a>
      <span id="status" class="status">Starting...</span>
    </div>
  </div>

  <div id="repoDetail"></div>
  <div class="grid" id="repos"></div>

  <div class="sticky-footer">
    <div class="sticky-footer-inner small muted">
      <span id="footerStatus">git viewer: starting...</span>
    </div>
  </div>

  <script type="module">
    import git from 'https://cdn.jsdelivr.net/npm/isomorphic-git@1.25.0/+esm';
    import http from 'https://cdn.jsdelivr.net/npm/isomorphic-git@1.25.0/http/web/+esm';
    import LightningFS from 'https://cdn.jsdelivr.net/npm/@isomorphic-git/lightning-fs@4.6.0/+esm';

    const fs = new LightningFS('git-viewer');
    const repos = [
      {
        name: 'nostr-dag',
        url: 'https://github.com/RandyMcMillan/nostr-dag',
        dir: '/repos/nostr-dag',
      },
      {
        name: 'isomorphic-git',
        url: 'https://github.com/isomorphic-git/isomorphic-git',
        dir: '/repos/isomorphic-git',
      },
      {
        name: 'nostr-tools',
        url: 'https://github.com/nbd-wtf/nostr-tools',
        dir: '/repos/nostr-tools',
      },
      {
        name: 'js-libp2p',
        url: 'https://github.com/libp2p/js-libp2p',
        dir: '/repos/js-libp2p',
      },
      {
        name: 'js-libp2p-noise',
        url: 'https://github.com/ChainSafe/js-libp2p-noise',
        dir: '/repos/js-libp2p-noise',
      },
      {
        name: 'js-libp2p-yamux',
        url: 'https://github.com/ChainSafe/js-libp2p-yamux',
        dir: '/repos/js-libp2p-yamux',
      },
      {
        name: 'discv5',
        url: 'https://github.com/ChainSafe/discv5',
        dir: '/repos/discv5',
      },
      {
        name: 'lightning-fs',
        url: 'https://github.com/isomorphic-git/lightning-fs',
        dir: '/repos/lightning-fs',
      },
    ];
    const faviconCache = new Map();
    window.gitFs = fs;
    window.gitRepos = repos;

    function warmFavicon(url) {
      if (faviconCache.has(url)) {
        return;
      }
      const image = new Image();
      image.decoding = 'async';
      image.referrerPolicy = 'no-referrer';
      image.src = url;
      faviconCache.set(url, image);
    }

    repos.forEach((repo) => warmFavicon(`${new URL(repo.url).origin}/favicon.ico`));

    const statusEl = document.getElementById('status');
    const footerStatusEl = document.getElementById('footerStatus');
    const repoDetailEl = document.getElementById('repoDetail');
    const reposEl = document.getElementById('repos');
    const repoState = new Map();
    const params = new URLSearchParams(window.location.search);
    const pathParts = window.location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
    const selectedRepoName = params.get('repo') || (pathParts[0] === 'git' && pathParts[1] ? decodeURIComponent(pathParts[1]) : null);
    const selectedBranchName = params.get('branch');
    const siteRoot = new URL('../', window.location.href).pathname;
    const gitRoot = `${siteRoot}git/`;

    function setStatus(text) {
      statusEl.textContent = text;
      footerStatusEl.textContent = `git viewer: ${text}`;
    }

    function setRepoStatus(repoName, text) {
      repoState.set(repoName, text);
      renderRepos();
    }

    function repoHref(repo, branch = null) {
      const next = new URLSearchParams();
      if (branch) {
        next.set('branch', branch);
      }
      const query = next.toString();
      return `${gitRoot}${encodeURIComponent(repo.name)}/${query ? `?${query}` : ''}`;
    }

    function overviewHref() {
      return gitRoot;
    }

    async function pathExists(path) {
      try {
        await fs.promises.stat(path);
        return true;
      } catch {
        return false;
      }
    }

    function repoCard(repo, data) {
      const iconUrl = `${new URL(repo.url).origin}/favicon.ico`;
      const activeClass = selectedRepoName === repo.name ? ' active' : '';
      return `
        <div class="repo${activeClass}">
          <h3 class="repo-title">
            <img class="repo-icon" src="${iconUrl}" alt="" loading="eager" fetchpriority="high" />
            <a href="${repoHref(repo, data.ref === 'HEAD' ? null : data.ref)}" target="_blank" rel="noreferrer noopener">${repo.name}</a>
          </h3>
          <div class="small muted"><a href="${repo.url}" target="_blank" rel="noreferrer noopener">${repo.url}</a></div>
          <div class="small" style="margin-top:8px;"><span class="muted">Status:</span> ${repoState.get(repo.name) || 'idle'}</div>
          <div class="small" style="margin-top:8px;"><span class="muted">Ref:</span> <span class="mono">${data.ref || 'n/a'}</span></div>
          <div class="small" style="margin-top:8px;"><span class="muted">Latest:</span> <span class="mono">${data.latest || 'n/a'}</span></div>
          <div class="small" style="margin-top:8px;"><span class="muted">Tags:</span> ${data.tags.length ? data.tags.map((tag) => `<span class="mono">${tag}</span>`).join(' ') : 'none'}</div>
          <div class="small" style="margin-top:8px;"><span class="muted">Files:</span></div>
          <ul>
            ${data.files.length ? data.files.map((file) => `<li class="mono" style="word-break:break-all;">${file}</li>`).join('') : '<li>none</li>'}
          </ul>
          <div class="repo-footer">
            <div class="repo-actions">
              <button class="repo-refresh" type="button" data-refresh-repo="${repo.name}">Refresh</button>
              <a class="button repo-open" href="${repoHref(repo, data.ref === 'HEAD' ? null : data.ref)}" target="_blank" rel="noreferrer noopener">Open full viewer</a>
            </div>
          </div>
        </div>
      `;
    }

    async function ensureRepo(repo) {
      const url = repo.url;
      const dir = repo.dir;
      try {
        const exists = await pathExists(dir);
        if (!exists) {
          setRepoStatus(repo.name, 'cloning...');
          await fs.promises.mkdir(dir, { recursive: true });
          await git.clone({
            fs,
            http,
            dir,
            corsProxy: 'https://cors.isomorphic-git.org',
            url,
            singleBranch: true,
            depth: 1,
          });
        } else {
          setRepoStatus(repo.name, 'reusing cached clone...');
        }
      } catch (e) {
        setRepoStatus(repo.name, `prepare failed: ${e.message}`);
        throw e;
      }

      setRepoStatus(repo.name, 'ready');
    }

    async function readRepo(repo, commitDepth = 1, refOverride = null, fileLimit = 40) {
      const branches = await git.listBranches({ fs, dir: repo.dir }).catch(() => []);
      const ref = refOverride || (branches.includes('main')
        ? 'main'
        : branches.includes('master')
          ? 'master'
          : branches[0] || 'HEAD');
      const commits = await git.log({ fs, dir: repo.dir, ref, depth: commitDepth }).catch(() => []);
      const latest = (commits[0] && commits[0].commit && commits[0].commit.message) || 'n/a';
      const files = await git.listFiles({ fs, dir: repo.dir }).catch(() => []);
      const tags = await git.listTags({ fs, dir: repo.dir }).catch(() => []);
      const sortedTags = tags.slice().sort((a, b) => a.localeCompare(b));
      const latestTag = sortedTags.length ? sortedTags[sortedTags.length - 1] : null;
      return {
        latest,
        files: files.slice(0, fileLimit),
        tags: latestTag ? [latestTag] : [],
        ref,
        branches,
        commits,
      };
    }

    function repoDetail(repo, data) {
      const selectedBranch = selectedBranchName && data.branches.includes(selectedBranchName)
        ? selectedBranchName
        : data.ref;
      const branchOptions = data.branches.length
        ? data.branches.map((branch) => `<option value="${branch}" ${branch === selectedBranch ? 'selected' : ''}>${branch}</option>`).join('')
        : '<option value="">no branches</option>';
      const commitList = data.commits.length
        ? data.commits.map((entry) => {
            const commit = entry.commit || {};
            const author = commit.author || {};
            return `
              <li style="margin-bottom:8px;">
                <div><span class="mono">${entry.oid || ''}</span></div>
                <div class="small muted">${author.name || 'unknown'} · ${author.email || ''} · ${author.timestamp ? new Date(author.timestamp * 1000).toLocaleString() : ''}</div>
                <div>${commit.message || 'n/a'}</div>
              </li>
            `;
          }).join('')
        : '<li>none</li>';
      return `
        <div class="panel">
          <div class="row" style="justify-content:space-between; align-items:flex-start;">
            <div>
              <div class="small muted">Repository viewer</div>
              <h2 style="margin:4px 0 0;">${repo.name}</h2>
              <div class="small muted"><a href="${repo.url}" target="_blank" rel="noreferrer noopener">${repo.url}</a></div>
            </div>
            <a class="button" href="${overviewHref()}">Back to all repos</a>
          </div>
          <div class="grid" style="margin-top:14px;">
            <div class="panel" style="margin:0;">
              <div class="small muted">Branch</div>
              <select id="detailBranchSelect" style="width:100%; margin-top:8px;">${branchOptions}</select>
              <div class="small" style="margin-top:10px;"><span class="muted">Ref:</span> <span class="mono">${data.ref || 'n/a'}</span></div>
              <div class="small" style="margin-top:8px;"><span class="muted">Latest tag:</span> <span class="mono">${data.tags[0] || 'none'}</span></div>
              <div class="small" style="margin-top:8px;"><span class="muted">Files:</span> ${data.files.length}</div>
              <div class="small" style="margin-top:8px;"><span class="muted">Tags:</span> ${data.tags.length ? data.tags.map((tag) => `<span class="mono">${tag}</span>`).join(' ') : 'none'}</div>
            </div>
            <div class="panel" style="margin:0;">
              <div class="small muted">Recent commits</div>
              <ol style="margin-top:8px; padding-left:18px;">${commitList}</ol>
            </div>
          </div>
          <div class="panel" style="margin-top:14px;">
            <div class="small muted">Files</div>
            <ul style="margin-top:8px;">
              ${data.files.length ? data.files.map((file) => `<li class="mono" style="word-break:break-all;">${file}</li>`).join('') : '<li>none</li>'}
            </ul>
          </div>
        </div>
      `;
    }

    function renderRepos(results = null) {
      const data = results || repos.map(() => ({ latest: 'n/a', files: [], tags: [] }));
      reposEl.innerHTML = repos.map((repo, i) => repoCard(repo, data[i])).join('');
      reposEl.querySelectorAll('[data-refresh-repo]').forEach((button) => {
        button.addEventListener('click', () => {
          void refreshOneRepo(button.getAttribute('data-refresh-repo'));
        });
      });
    }

    function renderDetail(results = null) {
      if (!selectedRepoName) {
        repoDetailEl.innerHTML = '';
        return;
      }
      const repo = repos.find((entry) => entry.name === selectedRepoName);
      if (!repo) {
        repoDetailEl.innerHTML = `<div class="panel">Unknown repo: <span class="mono">${selectedRepoName}</span></div>`;
        return;
      }
      const data = results && results[repo.name];
      if (!data) {
        repoDetailEl.innerHTML = `<div class="panel">Loading ${repo.name}…</div>`;
        return;
      }
      repoDetailEl.innerHTML = repoDetail(repo, data);
      const branchSelect = document.getElementById('detailBranchSelect');
      if (branchSelect) {
        branchSelect.addEventListener('change', () => {
          const next = new URLSearchParams(window.location.search);
          if (branchSelect.value) {
            next.set('branch', branchSelect.value);
          } else {
            next.delete('branch');
          }
          const query = next.toString();
          window.location.href = `${gitRoot}${encodeURIComponent(repo.name)}/${query ? `?${query}` : ''}`;
        });
      }
    }

    async function refresh() {
      try {
        setStatus('loading repos...');
        renderRepos();
        const ensured = await Promise.allSettled(repos.map(ensureRepo));
        const failed = ensured.filter((result) => result.status === 'rejected');
        if (failed.length) {
          setStatus(`partial: ${repos.length - failed.length}/${repos.length} repos ready`);
        }
        const results = await Promise.all(repos.map((repo) => {
          const isSelected = repo.name === selectedRepoName;
          return readRepo(repo, isSelected ? 20 : 1, isSelected ? (selectedBranchName || null) : null, isSelected ? 200 : 40);
        }));
        const resultMap = {};
        repos.forEach((repo, index) => {
          resultMap[repo.name] = results[index];
        });
        renderRepos(results);
        renderDetail(resultMap);
        setStatus('ready');
      } catch (e) {
        setStatus(`unavailable: ${e.message}`);
        console.warn('git viewer failed:', e);
      }
    }

    async function refreshOneRepo(repoName) {
      const repo = repos.find((entry) => entry.name === repoName);
      if (!repo) {
        return;
      }
      try {
        setRepoStatus(repo.name, 'refreshing...');
        await ensureRepo(repo);
        const data = await readRepo(repo, repo.name === selectedRepoName ? 20 : 1, repo.name === selectedRepoName ? (selectedBranchName || null) : null, repo.name === selectedRepoName ? 200 : 40);
        const current = {};
        repos.forEach((entry) => {
          current[entry.name] = {
            latest: 'n/a',
            files: [],
            tags: [],
          };
        });
        current[repo.name] = data;
        renderRepos(repos.map((entry) => current[entry.name]));
        if (selectedRepoName) {
          const allResults = {};
          repos.forEach((entry, index) => {
            allResults[entry.name] = current[entry.name];
          });
          renderDetail(allResults);
        }
        setStatus('ready');
      } catch (e) {
        setRepoStatus(repo.name, `refresh failed: ${e.message}`);
        console.warn('repo refresh failed:', repo.name, e);
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', () => { void refresh(); });
    void refresh();
  </script>
</body>
</html>
