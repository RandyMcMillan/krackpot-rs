<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nostr-dag Git Viewer</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px 20px 80px; background:#0f172a; color:#e2e8f0; }
    h1 { margin: 0 0 6px; color: #a78bfa; }
    .muted { color:#94a3b8; }
    .panel { background:#111827; border:1px solid #334155; border-radius:8px; padding:14px; margin:14px 0; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    .repo { border:1px solid #334155; border-radius:8px; background:#0b1220; padding:12px; }
    .repo h3 { margin-top:0; }
    .status { padding:8px 10px; border-radius:6px; background:#1f2937; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size:12px; }
    ul { padding-left:18px; }
    button, a.button { background:#4c1d95; color:#e2e8f0; border:1px solid #6d28d9; border-radius:6px; padding:8px 12px; text-decoration:none; cursor:pointer; }
    button:hover, a.button:hover { background:#5b21b6; }
    .sticky-footer { position:fixed; left:0; right:0; bottom:0; background:#020617; border-top:1px solid #334155; padding:10px 20px; z-index:40; }
    .sticky-footer-inner { max-width:1200px; margin:0 auto; }
    @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <h1>nostr-dag Git Viewer</h1>
  <div class="muted">Browse cloned repositories in the browser. Endpoint: <span class="mono">/git/</span></div>

  <div class="panel">
    <div class="row">
      <button id="refreshBtn" type="button">Refresh repos</button>
      <a class="button" href="/"><span>Back to demo</span></a>
      <span id="status" class="status">Starting...</span>
    </div>
  </div>

  <div class="grid" id="repos"></div>

  <div class="sticky-footer">
    <div class="sticky-footer-inner small muted">
      <span id="footerStatus">git viewer: starting...</span>
    </div>
  </div>

  <script type="module">
    import git from 'https://cdn.jsdelivr.net/npm/isomorphic-git@1.25.0/+esm';
    import http from 'https://cdn.jsdelivr.net/npm/isomorphic-git@1.25.0/http/web/+esm';
    import LightningFS from 'https://cdn.jsdelivr.net/npm/@isomorphic-git/lightning-fs@4.6.0/+esm';

    const fs = new LightningFS('git-viewer');
    const REPO_CACHE_KEY = 'nostr-dag-git-repo-cache-v1';
    const repos = [
      {
        name: 'nostr-dag',
        url: 'https://github.com/RandyMcMillan/nostr-dag',
        dir: '/repos/nostr-dag',
      },
      {
        name: 'isomorphic-git',
        url: 'https://github.com/isomorphic-git/isomorphic-git',
        dir: '/repos/isomorphic-git',
      },
      {
        name: 'nostr-tools',
        url: 'https://github.com/nbd-wtf/nostr-tools',
        dir: '/repos/nostr-tools',
      },
      {
        name: 'js-libp2p',
        url: 'https://github.com/libp2p/js-libp2p',
        dir: '/repos/js-libp2p',
      },
      {
        name: 'js-libp2p-noise',
        url: 'https://github.com/ChainSafe/js-libp2p-noise',
        dir: '/repos/js-libp2p-noise',
      },
      {
        name: 'js-libp2p-yamux',
        url: 'https://github.com/ChainSafe/js-libp2p-yamux',
        dir: '/repos/js-libp2p-yamux',
      },
      {
        name: 'discv5',
        url: 'https://github.com/ChainSafe/discv5',
        dir: '/repos/discv5',
      },
      {
        name: 'lightning-fs',
        url: 'https://github.com/isomorphic-git/lightning-fs',
        dir: '/repos/lightning-fs',
      },
    ];
    const faviconCache = new Map();

    function warmFavicon(url) {
      if (faviconCache.has(url)) {
        return;
      }
      const image = new Image();
      image.decoding = 'async';
      image.referrerPolicy = 'no-referrer';
      image.src = url;
      faviconCache.set(url, image);
    }

    repos.forEach((repo) => warmFavicon(`${new URL(repo.url).origin}/favicon.ico`));

    const statusEl = document.getElementById('status');
    const footerStatusEl = document.getElementById('footerStatus');
    const reposEl = document.getElementById('repos');
    const repoState = new Map();

    function setStatus(text) {
      statusEl.textContent = text;
      footerStatusEl.textContent = `git viewer: ${text}`;
    }

    function setRepoStatus(repoName, text) {
      repoState.set(repoName, text);
      renderRepos();
    }

    function loadRepoCache() {
      try {
        const raw = window.localStorage.getItem(REPO_CACHE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveRepoCache(cache) {
      try {
        window.localStorage.setItem(REPO_CACHE_KEY, JSON.stringify(cache));
      } catch {
        // Best-effort only.
      }
    }

    function cacheRepoData(repoName, data) {
      const cache = loadRepoCache();
      cache[repoName] = data;
      saveRepoCache(cache);
    }

    function emptyRepoData() {
      return {
        latest: 'n/a',
        files: [],
        tags: [],
        branches: [],
        ref: 'n/a',
      };
    }

    function buildSelectOptions(items, selectedValue, placeholder) {
      const options = items.length
        ? items.map((item) => `<option value="${item}" ${item === selectedValue ? 'selected' : ''}>${item}</option>`).join('')
        : '<option value="">none</option>';
      return `<option value="">${placeholder}</option>${options}`;
    }

    async function pathExists(path) {
      try {
        await fs.promises.stat(path);
        return true;
      } catch {
        return false;
      }
    }

    function createRepoCardModel(repo, data) {
      const iconUrl = `${new URL(repo.url).origin}/favicon.ico`;
      const fileItems = data.files.length
        ? data.files.map((file) => `<li class="mono" style="word-break:break-all;">${file}</li>`).join('')
        : '<li>none</li>';
      const tagItems = data.tags.length
        ? data.tags.map((tag) => `<span class="mono">${tag}</span>`).join(' ')
        : 'none';

      return {
        repo,
        iconUrl,
        status: repoState.get(repo.name) || 'idle',
        ref: data.ref || 'n/a',
        latest: data.latest || 'n/a',
        tags: tagItems,
        files: fileItems,
        toolbar: {
          refreshId: repo.name,
          primaryHref: repo.url,
          primaryLabel: 'Open upstream',
          secondaryHref: `${window.location.pathname}?repo=${encodeURIComponent(repo.name)}`,
          secondaryLabel: 'Open details',
        },
      };
    }

    function renderRepoCard(card) {
      return `
        <div class="repo">
          <h3 class="row" style="gap:8px;align-items:center;">
            <img src="${card.iconUrl}" alt="" width="16" height="16" loading="eager" fetchpriority="high" style="border-radius:3px;" />
            <span>${card.repo.name}</span>
          </h3>
          <div class="small muted"><a href="${card.repo.url}" target="_blank" rel="noreferrer noopener">${card.repo.url}</a></div>
          <div class="small" style="margin-top:8px;"><span class="muted">Status:</span> ${card.status}</div>
          <div class="small" style="margin-top:8px;"><span class="muted">Ref:</span> <span class="mono">${card.ref}</span></div>
          <div class="small" style="margin-top:8px;"><span class="muted">Latest:</span> <span class="mono">${card.latest}</span></div>
          <div class="small" style="margin-top:8px;"><span class="muted">Tags:</span> ${card.tags}</div>
          <div class="small" style="margin-top:8px;"><span class="muted">Files:</span></div>
          <ul>
            ${card.files}
          </ul>
          <div class="row" style="margin-top:12px; justify-content:flex-end;">
            <button class="repo-refresh" type="button" data-refresh-repo="${card.toolbar.refreshId}">Refresh</button>
            <a class="button" href="${card.toolbar.secondaryHref}">${card.toolbar.secondaryLabel}</a>
            <a class="button" href="${card.toolbar.primaryHref}" target="_blank" rel="noreferrer noopener">${card.toolbar.primaryLabel}</a>
          </div>
        </div>
      `;
    }

    function repoCard(repo, data) {
      return renderRepoCard(createRepoCardModel(repo, data));
    }

    async function ensureRepo(repo) {
      const url = repo.url;
      const dir = repo.dir;
      try {
        const exists = await pathExists(dir);
        if (!exists) {
          setRepoStatus(repo.name, 'cloning...');
          await fs.promises.mkdir(dir, { recursive: true });
          await git.clone({
            fs,
            http,
            dir,
            corsProxy: 'https://cors.isomorphic-git.org',
            url,
            singleBranch: true,
            depth: 1,
          });
        } else {
          setRepoStatus(repo.name, 'reusing cached clone...');
        }
      } catch (e) {
        setRepoStatus(repo.name, `prepare failed: ${e.message}`);
        throw e;
      }

      setRepoStatus(repo.name, 'fetching tags...');
      await fetchRepoRefs(repo).catch(() => {});
      setRepoStatus(repo.name, 'ready');
    }

    async function fetchRepoRefs(repo) {
      await git.fetch({
        fs,
        http,
        dir: repo.dir,
        corsProxy: 'https://cors.isomorphic-git.org',
        url: repo.url,
        all: true,
        tags: true,
        depth: 1,
      });
    }

    async function readRepo(repo) {
      const branches = await git.listBranches({ fs, dir: repo.dir }).catch(() => []);
      const ref = branches.includes('main')
        ? 'main'
        : branches.includes('master')
          ? 'master'
          : branches[0] || 'HEAD';
      const commits = await git.log({ fs, dir: repo.dir, ref, depth: 1 });
      const latest = commits[0]?.commit?.message || 'n/a';
      const files = await git.listFiles({ fs, dir: repo.dir }).catch(() => []);
      const tags = await git.listTags({ fs, dir: repo.dir }).catch(() => []);
      const latestTag = tags.sort((a, b) => a.localeCompare(b)).at(-1) || null;
      return {
        latest,
        files: files.slice(0, 40),
        tags: latestTag ? [latestTag] : [],
        ref,
      };
    }

    function renderRepos(results = null) {
      const cache = loadRepoCache();
      const data = results || repos.map((repo) => cache[repo.name] || { latest: 'n/a', files: [], tags: [] });
      reposEl.innerHTML = repos.map((repo, i) => repoCard(repo, data[i])).join('');
      reposEl.querySelectorAll('[data-refresh-repo]').forEach((button) => {
        button.addEventListener('click', () => {
          void refreshOneRepo(button.getAttribute('data-refresh-repo'));
        });
      });
    }

    async function refreshOneRepo(repoName) {
      const repo = repos.find((entry) => entry.name === repoName);
      if (!repo) return;
      setRepoStatus(repo.name, 'refreshing...');
      await ensureRepo(repo);
      const data = await readRepo(repo);
      cacheRepoData(repo.name, data);
      renderRepos(repos.map((entry) => {
        const cache = loadRepoCache();
        return entry.name === repo.name ? data : (cache[entry.name] || { latest: 'n/a', files: [], tags: [] });
      }));
      setRepoStatus(repo.name, 'ready');
    }

    async function refresh() {
      try {
        setStatus('loading repos...');
        renderRepos();
        const ensured = await Promise.allSettled(repos.map(ensureRepo));
        const failed = ensured.filter((result) => result.status === 'rejected');
        if (failed.length) {
          setStatus(`partial: ${repos.length - failed.length}/${repos.length} repos ready`);
        }
        const results = await Promise.all(repos.map(readRepo));
        results.forEach((data, index) => cacheRepoData(repos[index].name, data));
        renderRepos(results);
        setStatus('ready');
      } catch (e) {
        setStatus(`unavailable: ${e.message}`);
        console.warn('git viewer failed:', e);
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', () => { void refresh(); });
    void refresh();
  </script>
</body>
</html>
