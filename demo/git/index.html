<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="/favicon.ico" />
<title>nostr-dag Git Viewer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --fg: #e2e8f0;
    --muted: #94a3b8;
    --panel: #111827;
    --surface: #0b1220;
    --surface-strong: #020617;
    --border: #334155;
    --border-strong: #6d28d9;
    --input-bg: #020617;
    --input-fg: #e2e8f0;
    --accent: #a78bfa;
    --button-bg: #4c1d95;
    --button-hover: #5b21b6;
    --status-bg: #1f2937;
    --shadow: rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc;
      --fg: #0f172a;
      --muted: #475569;
      --panel: #ffffff;
      --surface: #f1f5f9;
      --surface-strong: #e2e8f0;
      --border: #cbd5e1;
      --border-strong: #7c3aed;
      --input-bg: #ffffff;
      --input-fg: #0f172a;
      --accent: #6d28d9;
      --button-bg: #7c3aed;
      --button-hover: #6d28d9;
      --status-bg: #e2e8f0;
      --shadow: rgba(15,23,42,.12);
    }
  }
  body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px 20px 80px; background:var(--bg); color:var(--fg); }
  h1 { margin: 0 0 6px; color: var(--accent); }
  .muted { color:var(--muted); }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; margin:14px 0; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .detail-grid { display:grid; grid-template-columns: 2fr 1fr; gap:14px; }
  .repo { border:1px solid var(--border); border-radius:8px; background:var(--surface); padding:12px; }
  .repo h3 { margin-top:0; }
  .status { display:inline-flex; align-items:center; gap:6px; padding:8px 10px; border-radius:6px; background:var(--status-bg); }
  .status-dot { width:8px; height:8px; border-radius:999px; background:currentColor; box-shadow:0 0 0 2px var(--surface); }
  .status-idle { color: var(--muted); }
  .status-checking { color: #f59e0b; }
  .status-available { color: #22c55e; }
  .status-unavailable { color: #ef4444; }
  .health-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; border:1px solid var(--border); background:var(--status-bg); font-size:12px; line-height:1; white-space:nowrap; }
  .health-dot { width:8px; height:8px; border-radius:999px; background:currentColor; box-shadow:0 0 0 2px var(--surface); }
  .health-idle { color: var(--muted); }
  .health-checking { color: #f59e0b; }
  .health-available { color: #22c55e; }
  .health-unavailable { color: #ef4444; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size:12px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:var(--status-bg); }
  .list { list-style:none; padding:0; margin:0; }
  .list-item { border-bottom:1px solid var(--status-bg); padding:10px 0; }
  .list-item:last-child { border-bottom:0; }
  .detail-shell { border:1px solid var(--border); border-radius:8px; background:var(--surface); padding:12px; }
  .detail-empty { padding:18px; border:1px dashed var(--border); border-radius:8px; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  ul { padding-left:18px; }
  button, a.button { background:var(--button-bg); color:var(--fg); border:1px solid var(--border-strong); border-radius:6px; padding:8px 12px; text-decoration:none; cursor:pointer; }
  button:hover, a.button:hover { background:var(--button-hover); }
  .sticky-footer { position:fixed; left:0; right:0; bottom:0; background:var(--surface-strong); border-top:1px solid var(--border); padding:10px 20px; z-index:40; }
  .sticky-footer-inner { max-width:1200px; margin:0 auto; }
  @media (max-width: 900px) { .grid, .detail-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <h1>nostr-dag Git Viewer</h1>
  <div class="muted">Browse cloned repositories in the browser. Endpoint: <span class="mono">/git/</span></div>

  <div class="panel">
    <div class="row">
      <button id="refreshBtn" type="button">Refresh repos</button>
      <a class="button" href="/"><span>Back to demo</span></a>
      <span id="status" class="status status-idle" title="Starting..."><span class="status-dot"></span></span>
    </div>
  </div>

  <div class="grid" id="repos"></div>

  <div class="sticky-footer">
    <div class="sticky-footer-inner small muted">
      <span id="footerStatus" class="status status-idle" title="git viewer: starting..."><span class="status-dot"></span></span>
    </div>
  </div>

  <script type="module">
    import git from 'https://cdn.jsdelivr.net/npm/isomorphic-git@1.25.0/+esm';
    import http from 'https://cdn.jsdelivr.net/npm/isomorphic-git@1.25.0/http/web/+esm';
    import LightningFS from 'https://cdn.jsdelivr.net/npm/@isomorphic-git/lightning-fs@4.6.0/+esm';

    const fs = new LightningFS('git-viewer');
    const REPO_CACHE_KEY = 'nostr-dag-git-repo-cache-v1';
    const repoHealth = new Map();
    const repos = [
      {
        name: 'nostr-dag',
        url: 'https://github.com/RandyMcMillan/nostr-dag',
        dir: '/repos/nostr-dag',
      },
      {
        name: 'isomorphic-git',
        url: 'https://github.com/isomorphic-git/isomorphic-git',
        dir: '/repos/isomorphic-git',
      },
      {
        name: 'nostr-tools',
        url: 'https://github.com/nbd-wtf/nostr-tools',
        dir: '/repos/nostr-tools',
      },
      {
        name: 'js-libp2p',
        url: 'https://github.com/libp2p/js-libp2p',
        dir: '/repos/js-libp2p',
      },
      {
        name: 'js-libp2p-noise',
        url: 'https://github.com/ChainSafe/js-libp2p-noise',
        dir: '/repos/js-libp2p-noise',
      },
      {
        name: 'js-libp2p-yamux',
        url: 'https://github.com/ChainSafe/js-libp2p-yamux',
        dir: '/repos/js-libp2p-yamux',
      },
      {
        name: 'discv5',
        url: 'https://github.com/ChainSafe/discv5',
        dir: '/repos/discv5',
      },
      {
        name: 'lightning-fs',
        url: 'https://github.com/isomorphic-git/lightning-fs',
        dir: '/repos/lightning-fs',
      },
    ];
    const faviconCache = new Map();

    function warmFavicon(url) {
      if (faviconCache.has(url)) {
        return;
      }
      const image = new Image();
      image.decoding = 'async';
      image.referrerPolicy = 'no-referrer';
      image.src = url;
      faviconCache.set(url, image);
    }

    repos.forEach((repo) => warmFavicon(`${new URL(repo.url).origin}/favicon.ico`));

    const statusEl = document.getElementById('status');
    const footerStatusEl = document.getElementById('footerStatus');
    const reposEl = document.getElementById('repos');
    const repoState = new Map();
    const refreshBtn = document.getElementById('refreshBtn');

    function setStatus(text, state = 'idle') {
      statusEl.className = `status status-${state}`;
      footerStatusEl.className = `status status-${state}`;
      statusEl.title = text;
      footerStatusEl.title = `git viewer: ${text}`;
    }

    function setRepoStatus(repoName, text) {
      repoState.set(repoName, text);
    }

    function setRepoHealth(repoName, state) {
      repoHealth.set(repoName, state);
    }

    function getRepoHealth(repoName) {
      return repoHealth.get(repoName) || 'idle';
    }

    function repoHealthLabel(state) {
      return '';
    }

    function repoHealthClass(state) {
      if (state === 'checking') return 'health-checking';
      if (state === 'available') return 'health-available';
      if (state === 'unavailable') return 'health-unavailable';
      return 'health-idle';
    }

    function repoCardStatusClass(status) {
      if (status === 'ready') return 'health-available';
      if (status === 'refreshing...' || status === 'cloning...' || status === 'fetching tags...' || status === 'reusing cached clone...') return 'health-checking';
      if (status.startsWith('prepare failed:') || status.startsWith('refresh failed:') || status.startsWith('unavailable:')) return 'health-unavailable';
      return 'health-idle';
    }

    function remoteProbeUrl(repo) {
      return `${new URL(repo.url).origin}/favicon.ico`;
    }

    async function probeRemoteHost(repo) {
      const controller = new AbortController();
      const timeout = window.setTimeout(() => controller.abort(), 8000);
      try {
        await fetch(remoteProbeUrl(repo), {
          method: 'GET',
          mode: 'no-cors',
          cache: 'no-store',
          signal: controller.signal,
        });
        return true;
      } catch {
        return false;
      } finally {
        window.clearTimeout(timeout);
      }
      renderApp();
    }

    function loadRepoCache() {
      try {
        const raw = window.localStorage.getItem(REPO_CACHE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveRepoCache(cache) {
      try {
        window.localStorage.setItem(REPO_CACHE_KEY, JSON.stringify(cache));
      } catch {
        // Best-effort only.
      }
    }

    function cacheRepoData(repoName, data) {
      const cache = loadRepoCache();
      cache[repoName] = data;
      saveRepoCache(cache);
    }

    function emptyRepoData() {
      return {
        latest: 'n/a',
        latestCommit: null,
        files: [],
        tags: [],
        branches: [],
        ref: 'n/a',
        defaultRef: 'n/a',
        selectedRef: 'n/a',
        commits: [],
      };
    }

    function buildSelectOptions(items, selectedValue, placeholder) {
      const options = items.length
        ? items.map((item) => `<option value="${item}" ${item === selectedValue ? 'selected' : ''}>${item}</option>`).join('')
        : '<option value="">none</option>';
      return `<option value="">${placeholder}</option>${options}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function renderLatestSummary(text) {
      const value = text || 'n/a';
      if (value.length <= 80) {
        return `<span class="muted">Latest:</span> <span class="mono">${escapeHtml(value)}</span>`;
      }
      const preview = `${value.slice(0, 80).trimEnd()}…`;
      return `
        <details class="small">
          <summary style="cursor:pointer;"><span class="muted">Latest:</span> <span class="mono">${escapeHtml(preview)}</span></summary>
          <div class="mono" style="margin-top:8px; word-break:break-word;">${escapeHtml(value)}</div>
        </details>
      `;
    }

    function repoSelectionHref(repo, { branch = null, tag = null } = {}) {
      const search = new URLSearchParams();
      search.set('repo', repo.name);
      if (branch) search.set('branch', branch);
      if (tag) search.set('tag', tag);
      return `/git/?${search.toString()}`;
    }

    function getRouteContext() {
      const params = new URLSearchParams(window.location.search);
      const repoName = params.get('repo') || '';
      const routeRepo = repos.find((entry) => entry.name === repoName) || null;
      return {
        repo: routeRepo,
        repoName: repoName || null,
        branch: params.get('branch') || '',
        tag: params.get('tag') || '',
      };
    }

    async function pathExists(path) {
      try {
        await fs.promises.stat(path);
        return true;
      } catch {
        return false;
      }
    }

    function createRepoCardModel(repo, data) {
      const iconUrl = `${new URL(repo.url).origin}/favicon.ico`;
      const selectedBranch = data.branches.includes(data.selectedRef) ? data.selectedRef : (data.branches[0] || '');
      const selectedTag = data.tags.includes(data.selectedRef) ? data.selectedRef : '';

      return {
        repo,
        iconUrl,
        status: repoState.get(repo.name) || 'idle',
        ref: data.ref || 'n/a',
        latest: data.latest || 'n/a',
        latestHtml: renderLatestSummary(data.latest || 'n/a'),
        selectedRef: data.selectedRef || data.ref || 'n/a',
        branches: data.branches || [],
        tagsList: data.tags || [],
        selectedBranch,
        selectedTag,
        toolbar: {
          refreshId: repo.name,
          primaryHref: repo.url,
          primaryLabel: 'Open upstream',
          secondaryHref: repoSelectionHref(repo, {
            branch: selectedBranch || null,
            tag: selectedTag || null,
          }),
          secondaryLabel: 'View repo',
        },
      };
    }

    function renderRepoCard(card) {
      return `
        <div class="repo">
          <div class="row" style="justify-content:space-between;align-items:center;gap:8px;">
            <h3 class="row" style="gap:8px;align-items:center;margin:0;">
              <a href="${card.repo.url}" target="_blank" rel="noreferrer noopener" aria-label="${card.repo.name} upstream">
                <img src="${card.iconUrl}" alt="" width="16" height="16" loading="eager" fetchpriority="high" style="border-radius:3px;" />
              </a>
              <a href="${card.repo.url}" target="_blank" rel="noreferrer noopener">${card.repo.name}</a>
            </h3>
            <div class="small muted" style="text-align:right;">
              <a href="${card.repo.url}" target="_blank" rel="noreferrer noopener">${card.repo.url}</a>
            </div>
          </div>
          <div class="small" style="margin-top:8px;"><span class="muted">Status:</span> <span class="health-badge ${repoCardStatusClass(card.status)}" title="${escapeHtml(card.status)}"><span class="health-dot"></span></span></div>
          <div class="small" style="margin-top:8px;"><span class="muted">Ref:</span> <span class="mono">${card.ref}</span></div>
          <div class="small" style="margin-top:4px;"><span class="muted">Selected:</span> <span class="mono">${escapeHtml(card.selectedRef)}</span></div>
          <div class="small" style="margin-top:8px;">${card.latestHtml}</div>
          <div class="small" style="margin-top:8px;">
            <div class="muted">Branches</div>
            <select data-branch-select="${card.repo.name}" style="width:100%; margin-top:6px;">
              ${buildSelectOptions(card.branches, card.selectedBranch, 'Quick jump branch')}
            </select>
          </div>
          <div class="small" style="margin-top:8px;">
            <div class="muted">Tags</div>
            <select data-tag-select="${card.repo.name}" style="width:100%; margin-top:6px;">
              ${buildSelectOptions(card.tagsList, card.selectedTag, 'Quick jump tag')}
            </select>
          </div>
          <div class="row" style="margin-top:12px; justify-content:flex-end;">
            <button class="repo-refresh" type="button" data-refresh-repo="${card.toolbar.refreshId}">Refresh</button>
            <button class="button" type="button" data-view-repo="${card.toolbar.refreshId}">${card.toolbar.secondaryLabel}</button>
            <a class="button" href="${card.toolbar.primaryHref}" target="_blank" rel="noreferrer noopener">${card.toolbar.primaryLabel}</a>
          </div>
        </div>
      `;
    }

    function repoCard(repo, data) {
      return renderRepoCard(createRepoCardModel(repo, data));
    }

    function createCommitSummary(commit) {
      const message = commit?.commit?.message || 'n/a';
      const summary = message.split('\n')[0] || 'n/a';
      const author = commit?.commit?.author?.name || 'unknown';
      const timestamp = Number(commit?.commit?.author?.timestamp);
      const date = Number.isFinite(timestamp) ? new Date(timestamp * 1000).toLocaleString() : 'n/a';
      return {
        oid: commit?.oid || 'n/a',
        summary,
        author,
        date,
        message,
      };
    }

    function defaultRefForRefs(branches, tags) {
      if (branches.includes('main')) return 'main';
      if (branches.includes('master')) return 'master';
      if (branches[0]) return branches[0];
      if (tags[0]) return tags[0];
      return 'HEAD';
    }

    function resolveRefSelection(branches, tags, route) {
      if (route.branch) return route.branch;
      if (route.tag) return route.tag;
      return defaultRefForRefs(branches, tags);
    }

    async function branchForCommit(repoDir, branches, commitOid) {
      if (!commitOid || !branches.length) return '';
      const matches = await Promise.all(branches.map(async (branch) => {
        try {
          const branchOid = await git.resolveRef({ fs, dir: repoDir, ref: branch });
          return branchOid === commitOid ? branch : '';
        } catch {
          return '';
        }
      }));
      return matches.find(Boolean) || '';
    }

    function selectedRefForRoute(route) {
      if (route?.branch) return route.branch;
      if (route?.tag) return route.tag;
      return null;
    }

    function refCandidatesForRoute(route, branches, tags) {
      if (route?.branch) {
        return [
          route.branch,
          `origin/${route.branch}`,
          `refs/remotes/origin/${route.branch}`,
          `refs/heads/${route.branch}`,
        ];
      }
      if (route?.tag) {
        return [
          route.tag,
          `refs/tags/${route.tag}`,
        ];
      }
      return [defaultRefForRefs(branches, tags), 'HEAD'];
    }

    function fetchSelectionOptions(route) {
      if (route?.branch) {
        return { ref: route.branch, singleBranch: true };
      }
      if (route?.tag) {
        return { ref: route.tag };
      }
      return {};
    }

    async function ensureRepo(repo, route = null) {
      const url = repo.url;
      const dir = repo.dir;
      try {
        const exists = await pathExists(dir);
        if (!exists) {
          setRepoStatus(repo.name, 'cloning...');
          await fs.promises.mkdir(dir, { recursive: true });
          await git.clone({
            fs,
            http,
            dir,
            corsProxy: 'https://cors.isomorphic-git.org',
            url,
            singleBranch: true,
            depth: 1,
          });
        } else {
          setRepoStatus(repo.name, 'reusing cached clone...');
        }
      } catch (e) {
        setRepoStatus(repo.name, `prepare failed: ${e.message}`);
        throw e;
      }

      setRepoStatus(repo.name, 'fetching tags...');
      await fetchRepoRefs(repo, route).catch(() => {});
      setRepoStatus(repo.name, 'ready');
    }

    async function fetchRepoRefs(repo, route = null) {
      const selection = fetchSelectionOptions(route);
      await git.fetch({
        fs,
        http,
        dir: repo.dir,
        corsProxy: 'https://cors.isomorphic-git.org',
        url: repo.url,
        all: true,
        tags: true,
        ...selection,
      });
    }

    async function readRepo(repo, route = null) {
      const localBranches = await git.listBranches({ fs, dir: repo.dir }).catch(() => []);
      const remoteBranches = await git.listBranches({ fs, dir: repo.dir, remote: 'origin' }).catch(() => []);
      const branches = [...new Set([...localBranches, ...remoteBranches])];
      const tags = await git.listTags({ fs, dir: repo.dir }).catch(() => []);
      tags.sort((a, b) => a.localeCompare(b));
      const ref = resolveRefSelection(branches, tags, route || {});
      const selectedRef = selectedRefForRoute(route) || ref;
      const candidates = refCandidatesForRoute(route, branches, tags);
      let commits = [];
      let resolvedRef = ref;
      for (const candidate of candidates) {
        if (!candidate) continue;
        try {
          commits = await git.log({ fs, dir: repo.dir, ref: candidate, depth: 12 });
          resolvedRef = candidate;
          break;
        } catch {
          commits = [];
        }
      }
      const latestCommit = commits[0] || null;
      const latest = latestCommit?.commit?.message || 'n/a';
      const branchForSelection = route?.tag
        ? await branchForCommit(repo.dir, branches, latestCommit?.oid || '')
        : '';
      const files = await git.listFiles({ fs, dir: repo.dir, ref: resolvedRef }).catch(() => []);
      return {
        latest,
        latestCommit: latestCommit ? createCommitSummary(latestCommit) : null,
        files: files.slice(0, 100),
        tags,
        branches: branches.sort((a, b) => a.localeCompare(b)),
        ref,
        defaultRef: defaultRefForRefs(branches, tags),
        selectedRef,
        resolvedRef,
        branchForSelection,
        commits: commits.slice(0, 12).map(createCommitSummary),
      };
    }

    function renderRepoList(results = null) {
      const cache = loadRepoCache();
      const data = results || repos.map((repo) => cache[repo.name] || emptyRepoData());
      reposEl.innerHTML = repos.map((repo, i) => repoCard(repo, data[i])).join('');
    }

    function renderCommitList(commits) {
      if (!commits.length) {
        return '<div class="detail-empty muted">No commits found.</div>';
      }
      return `<ul class="list">${commits.map((commit) => `
        <li class="list-item">
          <div class="mono">${escapeHtml(commit.oid.slice(0, 12))}</div>
          <div style="margin-top:4px;">${escapeHtml(commit.summary)}</div>
          <div class="small muted" style="margin-top:4px;">${escapeHtml(commit.author)} · ${escapeHtml(commit.date)}</div>
        </li>
      `).join('')}</ul>`;
    }

    function renderFileList(files) {
      if (!files.length) {
        return '<div class="detail-empty muted">No files found for this ref.</div>';
      }
      return `<ul class="list">${files.map((file) => `
        <li class="list-item mono">${escapeHtml(file)}</li>
      `).join('')}</ul>`;
    }

    function renderRepoDetail(repo, data, route) {
      const branchSelected = route.branch
        ? route.branch
        : (route.tag ? (data.branchForSelection || '') : (data.branches.includes(data.selectedRef) ? data.selectedRef : ''));
      const tagSelected = route.tag && data.tags.includes(route.tag) ? route.tag : (data.tags.includes(data.selectedRef) ? data.selectedRef : '');
      const currentRef = escapeHtml(data.resolvedRef || data.selectedRef || data.ref || 'n/a');
      const healthState = getRepoHealth(repo.name);
      const healthClass = repoHealthClass(healthState);
      const healthText = repoHealthLabel(healthState);
      const currentCommit = data.latestCommit || null;
      const latestMessage = currentCommit ? currentCommit.summary : 'n/a';
      const commitCount = data.commits.length;
      const detailSummary = `
        <div class="row" style="justify-content:space-between; align-items:flex-start;">
          <div>
            <div class="muted small">Repository</div>
            <div class="row" style="gap:10px; align-items:center; margin:4px 0 6px;">
              <h2 style="margin:0;">${escapeHtml(repo.name)}</h2>
              <span class="health-badge ${healthClass}"><span class="health-dot"></span></span>
            </div>
            <div class="small muted"><a href="${repo.url}" target="_blank" rel="noreferrer noopener">${repo.url}</a></div>
          </div>
          <div class="actions">
            <button type="button" data-refresh-repo="${repo.name}">Refresh</button>
            <a class="button" href="/git/">Back to repos</a>
            <a class="button" href="${repo.url}" target="_blank" rel="noreferrer noopener">Open upstream</a>
          </div>
        </div>
        <div class="row" style="margin-top:12px; gap:18px;">
          <span class="pill">Ref: <span class="mono">${currentRef}</span></span>
          <span class="pill">Files: ${data.files.length}</span>
          <span class="pill">Commits: ${commitCount}</span>
        </div>
        <div class="small" style="margin-top:10px;">
          <span class="muted">Latest:</span> <span class="mono">${escapeHtml(latestMessage)}</span>
        </div>
        ${currentCommit ? `
          <div class="small" style="margin-top:6px;">
            <span class="muted">Commit:</span> <span class="mono">${escapeHtml(currentCommit?.oid ? currentCommit.oid.slice(0, 12) : 'n/a')}</span>
            <span class="muted">·</span> <span>${escapeHtml(currentCommit.author)}</span>
            <span class="muted">·</span> <span>${escapeHtml(currentCommit.date)}</span>
          </div>
        ` : ''}
      `;

      return `
        <div class="detail-shell">
          ${detailSummary}
          <div class="row" style="margin-top:12px;">
            <div style="min-width:240px; flex:1;">
              <div class="muted">Branches</div>
              <select data-branch-select="${repo.name}" style="width:100%; margin-top:6px;">
                ${buildSelectOptions(data.branches, branchSelected, 'Quick jump branch')}
              </select>
            </div>
            <div style="min-width:240px; flex:1;">
              <div class="muted">Tags</div>
              <select data-tag-select="${repo.name}" style="width:100%; margin-top:6px;">
                ${buildSelectOptions(data.tags, tagSelected, 'Quick jump tag')}
              </select>
            </div>
          </div>
        </div>
        <div class="detail-grid" style="margin-top:14px;">
          <div class="detail-shell">
            <div class="row" style="justify-content:space-between; align-items:center;">
              <h3 style="margin:0;">Files at <span class="mono">${currentRef}</span></h3>
              <span class="muted small">${data.files.length} entries</span>
            </div>
            <div style="margin-top:10px;">${renderFileList(data.files)}</div>
          </div>
          <div class="detail-shell">
            <div class="row" style="justify-content:space-between; align-items:center;">
              <h3 style="margin:0;">Recent commits</h3>
              <span class="muted small">${commitCount} loaded</span>
            </div>
            <div style="margin-top:10px;">${renderCommitList(data.commits)}</div>
          </div>
        </div>
      `;
    }

    function renderRepoNotFound(route) {
      const repoName = route.repoName || 'unknown';
      const repoList = repos.map((repo) => `<li class="list-item"><a href="${repoSelectionHref(repo)}">${escapeHtml(repo.name)}</a></li>`).join('');
      reposEl.innerHTML = `
        <div class="detail-shell">
          <div class="row" style="justify-content:space-between; align-items:flex-start;">
            <div>
              <div class="muted small">Repository not found</div>
              <h2 style="margin:4px 0 0;">${escapeHtml(repoName)}</h2>
            </div>
            <div class="actions">
              <a class="button" href="/git/">Back to all repos</a>
            </div>
          </div>
          <div class="detail-empty" style="margin-top:12px;">
            The requested repository is not in this viewer.
          </div>
        </div>
        <div class="detail-shell" style="margin-top:14px;">
          <h3 style="margin-top:0;">Available repositories</h3>
          <ul class="list">${repoList}</ul>
        </div>
      `;
    }

    function renderApp(results = null) {
      const route = getRouteContext();
      if (route.repo) {
        const cache = loadRepoCache();
        const data = results && !Array.isArray(results) ? results : (cache[route.repo.name] || emptyRepoData());
        reposEl.className = '';
        reposEl.innerHTML = renderRepoDetail(route.repo, data, route);
      } else if (route.repoName) {
        reposEl.className = '';
        renderRepoNotFound(route);
      } else {
        reposEl.className = 'grid';
        renderRepoList(Array.isArray(results) ? results : null);
      }

      reposEl.querySelectorAll('[data-refresh-repo]').forEach((button) => {
        button.addEventListener('click', () => {
          void refreshOneRepo(button.getAttribute('data-refresh-repo'));
        });
      });
      reposEl.querySelectorAll('[data-view-repo]').forEach((button) => {
        button.addEventListener('click', async () => {
          const repoName = button.getAttribute('data-view-repo');
          const repo = repos.find((entry) => entry.name === repoName);
          if (!repo) return;
          const branchSelect = reposEl.querySelector(`[data-branch-select="${repo.name}"]`);
          const tagSelect = reposEl.querySelector(`[data-tag-select="${repo.name}"]`);
          const nextRoute = {
            repo,
            repoName: repo.name,
            branch: branchSelect && branchSelect.value ? branchSelect.value : null,
            tag: tagSelect && tagSelect.value ? tagSelect.value : null,
          };
          window.history.pushState({}, '', repoSelectionHref(repo, nextRoute));
          await refreshDetail(nextRoute);
        });
      });
      reposEl.querySelectorAll('[data-branch-select], [data-tag-select]').forEach((select) => {
        select.addEventListener('change', async () => {
          const repoName = select.getAttribute('data-branch-select') || select.getAttribute('data-tag-select');
          const repo = repos.find((entry) => entry.name === repoName);
          if (!repo) return;
          const isBranchSelect = !!select.getAttribute('data-branch-select');
          const nextRoute = {
            repo,
            repoName: repo.name,
            branch: isBranchSelect && select.value ? select.value : null,
            tag: !isBranchSelect && select.value ? select.value : null,
          };
          window.history.replaceState({}, '', repoSelectionHref(repo, nextRoute));
          await refreshDetail(nextRoute);
        });
      });
    }

    async function refreshOneRepo(repoName) {
      const repo = repos.find((entry) => entry.name === repoName);
      if (!repo) return;
      const route = getRouteContext().repo?.name === repo.name ? getRouteContext() : null;
      try {
        setRepoStatus(repo.name, 'refreshing...');
        if (route) setRepoHealth(repo.name, 'checking');
        const probe = route ? probeRemoteHost(repo).catch(() => false) : null;
        await ensureRepo(repo, route);
        const data = await readRepo(repo, route);
        cacheRepoData(repo.name, data);
        if (route) setRepoHealth(repo.name, (await probe) ? 'available' : 'unavailable');
        renderApp(repos.map((entry) => {
          const cache = loadRepoCache();
          return entry.name === repo.name ? data : (cache[entry.name] || emptyRepoData());
        }));
        setRepoStatus(repo.name, 'ready');
      } catch (e) {
        if (route) setRepoHealth(repo.name, 'unavailable');
        setRepoStatus(repo.name, `refresh failed: ${e.message}`);
        console.warn('git viewer failed:', e);
      }
    }

    async function refreshList() {
      try {
        setStatus('loading repos...', 'checking');
        renderApp();
        const ensured = await Promise.allSettled(repos.map(ensureRepo));
        const readyRepos = repos.filter((_, index) => ensured[index].status === 'fulfilled');
        const readResults = await Promise.allSettled(readyRepos.map((repo) => readRepo(repo)));
        const cache = loadRepoCache();
        const results = repos.map((repo) => {
          const readIndex = readyRepos.findIndex((entry) => entry.name === repo.name);
          if (readIndex >= 0 && readResults[readIndex].status === 'fulfilled') {
            const data = readResults[readIndex].value;
            cacheRepoData(repo.name, data);
            return data;
          }
          return cache[repo.name] || emptyRepoData();
        });
        renderApp(results);
        const readyCount = readyRepos.length;
        setStatus(readyCount === repos.length ? 'ready' : `partial: ${readyCount}/${repos.length} repos ready`, readyCount === repos.length ? 'available' : 'checking');
      } catch (e) {
        setStatus(`unavailable: ${e.message}`, 'unavailable');
        console.warn('git viewer failed:', e);
      }
    }

    async function refreshDetail(route) {
      if (!route.repo) {
        renderApp();
        return;
      }
      try {
        setStatus(`loading ${route.repo.name}...`, 'checking');
        setRepoHealth(route.repo.name, 'checking');
        renderApp();
        const probe = probeRemoteHost(route.repo).catch(() => false);
        await ensureRepo(route.repo, route);
        const data = await readRepo(route.repo, route);
        cacheRepoData(route.repo.name, data);
        const available = await probe;
        setRepoHealth(route.repo.name, available ? 'available' : 'unavailable');
        renderApp(data);
        setStatus('ready', 'available');
      } catch (e) {
        setRepoHealth(route.repo.name, 'unavailable');
        setStatus(`unavailable: ${e.message}`, 'unavailable');
        console.warn('git viewer failed:', e);
      }
    }

    async function refresh() {
      const route = getRouteContext();
      if (route.repo) {
        await refreshDetail(route);
      } else if (route.repoName) {
        renderApp();
        setStatus(`unknown repo: ${route.repoName}`, 'unavailable');
      } else {
        await refreshList();
      }
    }

    refreshBtn.addEventListener('click', () => { void refreshList(); });
    renderApp();
    void refresh();
  </script>
</body>
</html>
